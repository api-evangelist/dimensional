aid: dimensional
name: Dimensional
description: Dimensional is a Toronto-based personality-science company whose consumer
  mobile app assesses more than 200 traits across 15 dimensions — including cognition,
  values, communication styles, interests, love styles, attachment style, conflict
  resolution, strengths, and political ideology — to build detailed personality profiles.
  Users compare results with friends and explore relationship compatibility, positioning
  the product against social-media highlight reels in favor of authentic connection.
  The app is available on iOS with an Android beta, and the company is backed by Bloomberg
  Beta. No public API, SDK, or developer platform is published at this time; this
  profile captures the company's public web and security surface.
